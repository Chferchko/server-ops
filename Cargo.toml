[package]
name = "server-ops"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
russh = { version = "0.65.2", default-features = false, features = ["aws-lc-rs", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
